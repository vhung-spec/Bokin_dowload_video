name: Windows app

# Chạy test trên Windows, build bộ cài BokinClip-Setup-<phiên bản>.exe rồi thử cài / chạy / gỡ nó.
# Bộ cài nằm trong mục Artifacts của mỗi lần chạy; đẩy tag v* (vd. v1.0.0) thì tạo thêm GitHub Release.

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # để tạo GitHub Release khi đẩy tag v*

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cài ffmpeg (cho test tích hợp)
        run: choco install ffmpeg -y --no-progress
      - name: Cài thư viện
        run: python -m pip install -r requirements-dev.txt
      - name: Chạy test
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"

      - name: Build app (Python nhúng + thư viện + code)
        shell: pwsh
        run: packaging/windows/build.ps1 -PythonVersion "${{ steps.python.outputs.python-version }}"

      - name: Kiểm tra app khởi động được
        run: build\app\python\python.exe build\app\desktop.py --smoke-test --no-update

      - name: Kiểm tra cửa sổ app (WebView2)
        continue-on-error: true
        timeout-minutes: 3
        run: build\app\python\python.exe build\app\desktop.py --smoke-test-window --no-update

      - name: Thử tải 5 giây từ YouTube thật (chỉ để tham khảo, YouTube hay chặn máy chủ CI)
        continue-on-error: true
        timeout-minutes: 5
        run: build\app\python\python.exe build\app\clipper.py "https://www.youtube.com/watch?v=BaW_jenozKc" -d 5 -o build\yt-test

      - name: Đóng gói bộ cài (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path app.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV
          try {
            Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Vietnamese.isl" -OutFile packaging/windows/Vietnamese.isl
          } catch { Write-Warning "Không tải được bản dịch tiếng Việt, bộ cài dùng tiếng Anh: $_" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Thử cài đặt, chạy rồi gỡ bộ cài
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\BokinClip-Setup-*.exe | Select-Object -First 1).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Bokin Clip"
          foreach ($path in "$dir\python\BokinClip.exe", "$dir\desktop.py",
                           "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Bokin Clip.lnk") {
            if (-not (Test-Path $path)) { throw "Thiếu sau khi cài: $path" }
          }
          & "$dir\python\python.exe" "$dir\desktop.py" --smoke-test --no-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\python"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\python") { throw "Gỡ cài đặt chưa xoá hết $dir" }
          Write-Host "Cài / chạy / gỡ: ổn"

      - uses: actions/upload-artifact@v4
        with:
          name: BokinClip-Setup-${{ env.VERSION }}
          path: dist/BokinClip-Setup-*.exe
          if-no-files-found: error

      - name: Tạo GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist\BokinClip-Setup-*.exe).FullName
          --title "Bokin Clip ${{ env.VERSION }}"
          --notes "Tải file BokinClip-Setup-${{ env.VERSION }}.exe bên dưới rồi bấm đúp để cài (Windows 10/11, không cần quyền admin)."

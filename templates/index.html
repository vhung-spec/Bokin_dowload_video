<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bokin Clip</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='icon.png') }}">
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1d2129; --muted: #5f6673;
      --border: #d9dde3; --accent: #4f46e5; --accent-text: #ffffff; --error: #b42318;
      --ok: #157f3c; --tab: #eceef2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a; --card: #1e2127; --text: #e8eaed; --muted: #9aa0a6;
        --border: #343842; --accent: #5850ec; --accent-text: #ffffff; --error: #ff8a80;
        --ok: #6dd58c; --tab: #262a31;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }  /* để display: flex/grid của từng phần không làm hiện lại phần đã ẩn */
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; padding: 40px 16px;
    }
    main { width: 100%; max-width: 560px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 20px; }
    form, .result {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
    }
    label { display: block; font-size: .875rem; color: var(--muted); margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
    }
    textarea { min-height: 140px; resize: vertical; font-size: .9rem; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .row.two { grid-template-columns: repeat(2, 1fr); }
    input:disabled { opacity: .5; }
    .result audio { width: 100%; }
    .check { display: flex; align-items: center; gap: 8px; margin-top: 16px; color: var(--muted); font-size: .875rem; }
    .check input { width: auto; }
    .hint { margin-top: 6px; font-size: .8rem; color: var(--muted); }
    button { font: inherit; cursor: pointer; border-radius: 8px; }
    button:disabled { opacity: .6; cursor: progress; }
    .primary {
      width: 100%; margin-top: 20px; padding: 12px; font-weight: 600;
      color: var(--accent-text); background: var(--accent); border: 0;
    }
    .secondary {
      padding: 6px 12px; font-size: .875rem; font-weight: 600;
      color: var(--text); background: transparent; border: 1px solid var(--border);
    }
    .tabs, .segmented { display: flex; gap: 4px; padding: 4px; background: var(--tab); border-radius: 10px; }
    .tabs { margin-bottom: 12px; }
    .tabs button, .segmented button {
      flex: 1; padding: 8px; font-weight: 600; font-size: .9rem; color: var(--muted);
      background: transparent; border: 0;
    }
    .tabs button[aria-selected="true"], .segmented button[aria-checked="true"] { color: var(--text); background: var(--card); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
    .status { margin-top: 12px; min-height: 1.5em; font-size: .9rem; color: var(--muted); }
    .status.error { color: var(--error); }
    .result { margin-top: 16px; }
    .result video { width: 100%; border-radius: 8px; background: #000; }
    .result a { display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 600; word-break: break-all; }
    .field { margin-top: 16px; }
    .folder-row { display: flex; gap: 8px; }
    .folder-row input { flex: 1; min-width: 0; font-size: .9rem; }
    .folder-row button { flex: none; }
    .folder-status { min-height: 1.2em; }
    .folder-status.error { color: var(--error); }
    .saved { margin-top: 8px; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
    .result-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .result-actions a { margin-top: 0; font-size: .85rem; font-weight: 400; color: var(--muted); }
    .batch-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .batch-head .actions { display: flex; gap: 8px; }
    .batch-head + .items { margin-top: 12px; }
    .items { list-style: none; margin: 0; padding: 0; }
    .item { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
    .badge {
      flex: none; min-width: 76px; height: fit-content; padding: 2px 8px; text-align: center;
      font-size: .75rem; font-weight: 600; border-radius: 999px; color: var(--muted); background: var(--tab);
    }
    .item[data-state="working"] .badge { color: var(--accent-text); background: var(--accent); }
    .item[data-state="done"] .badge { color: var(--ok); }
    .item[data-state="error"] .badge { color: var(--error); }
    .item-body { min-width: 0; flex: 1; }
    .item-title { font-size: .9rem; overflow-wrap: anywhere; }
    .item-detail { font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
    .item[data-state="error"] .item-detail { color: var(--error); }
    footer { margin-top: 20px; text-align: center; font-size: .75rem; color: var(--muted); }
    @media (max-width: 420px) { .row { grid-template-columns: 1fr 1fr; } .row > :last-child { grid-column: span 2; } }
  </style>
</head>
<body>
<main>
  <h1>Tải nhanh video và nhạc YouTube</h1>
  <p class="sub">Chỉ tải đúng đoạn cần, không tải cả video, nên xong sau vài giây. Hoặc lấy nhạc MP3 cả bài.</p>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-one" aria-selected="true">Một video</button>
    <button type="button" role="tab" id="tab-many" aria-selected="false">Nhiều video</button>
  </div>

  <form id="form">
    <div id="one-input">
      <label for="url">Link YouTube</label>
      <input id="url" name="url" type="url" required autofocus
             placeholder="https://www.youtube.com/watch?v=...">
    </div>

    <div id="many-input" hidden>
      <label for="urls">Danh sách link YouTube (mỗi dòng một link)</label>
      <textarea id="urls" name="urls" spellcheck="false"
                placeholder="https://www.youtube.com/watch?v=...&#10;https://youtu.be/...&#10;..."></textarea>
      <div id="urls-count" class="hint">Dán cả đoạn văn cũng được, app sẽ tự lọc ra các link.</div>
    </div>

    <div class="field">
      <label id="kind-label">Tải về</label>
      <div class="segmented" role="radiogroup" aria-labelledby="kind-label">
        <button type="button" role="radio" id="kind-video" aria-checked="true">Video (MP4)</button>
        <button type="button" role="radio" id="kind-audio" aria-checked="false">Nhạc (MP3)</button>
      </div>
    </div>

    <div class="row" id="time-row">
      <div>
        <label for="start">Bắt đầu</label>
        <input id="start" name="start" value="0" placeholder="0 hoặc 1:30" title="Số giây hoặc mm:ss">
      </div>
      <div>
        <label for="duration">Độ dài (giây)</label>
        <input id="duration" name="duration" type="number" min="1" max="{{ max_duration }}" step="any"
               value="{{ default_duration }}">
      </div>
      <div id="quality-field">
        <label for="quality">Chất lượng</label>
        <select id="quality" name="quality">
          {% for q in qualities %}
          <option value="{{ q }}" {% if q == default_quality %}selected{% endif %}>{{ q }}p</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <label class="check" id="precise-label"><input id="precise" name="precise" type="checkbox"> Cắt chính xác từng khung hình (chậm hơn)</label>
    <label class="check" id="full-label" hidden><input id="full" name="full" type="checkbox" checked> Tải cả bài (đến hết video)</label>

    <div class="field">
      <label for="folder">Lưu vào</label>
      <div class="folder-row">
        <input id="folder" name="folder" value="{{ output_dir }}" spellcheck="false" autocomplete="off"
               title="Gõ hoặc dán đường dẫn thư mục, hoặc bấm Chọn…">
        <button id="choose-folder" class="secondary" type="button">Chọn…</button>
        <button id="open-folder" class="secondary" type="button">Mở</button>
      </div>
      <div id="folder-status" class="hint folder-status"></div>
    </div>

    <button id="submit" class="primary" type="submit">Tải {{ default_duration }} giây đầu</button>
    <div id="status" class="status" role="status"></div>
  </form>

  <div id="result" class="result" hidden>
    <video id="preview-video" controls playsinline hidden></video>
    <audio id="preview-audio" controls hidden></audio>
    <div class="saved">Đã lưu vào: <span id="saved-path"></span></div>
    <div class="result-actions">
      <button class="secondary open-folder" type="button">Mở thư mục</button>
      <a id="download" href="#" {% if desktop %}hidden{% endif %}>Tải thêm một bản qua trình duyệt</a>
    </div>
  </div>

  <section id="batch" class="result" hidden>
    <div class="batch-head">
      <strong id="batch-summary" role="status"></strong>
      <div class="actions">
        <button id="stop" class="secondary" type="button" hidden>Dừng</button>
        <button id="retry" class="secondary" type="button" hidden>Tải lại link lỗi</button>
        <button class="secondary open-folder" type="button">Mở thư mục</button>
      </div>
    </div>
    <ol id="items" class="items"></ol>
  </section>
  <footer>Bokin Clip {{ version }} · yt-dlp {{ ytdlp_version }}</footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const form = $("form"), button = $("submit"), statusBox = $("status");
  const CONCURRENCY = 3;  // số video tải cùng lúc ở tab "Nhiều video"
  const LABELS = { waiting: "Đang chờ", working: "Đang tải…", done: "Xong", error: "Lỗi", stopped: "Đã dừng" };
  let mode = "one", kind = "video", objectUrl = null, items = [], running = false, stopRequested = false;

  function extractLinks(text) {
    return [...new Set(text.match(/https?:\/\/[^\s"'<>,]+/g) || [])];
  }

  // Mô tả việc sẽ làm, vd. "15 giây đầu", "nhạc MP3 cả bài", "nhạc 20 giây từ 1:30".
  function describe() {
    const start = $("start").value.trim();
    const fromStart = start === "" || start === "0";
    if (kind === "audio" && $("full").checked) return fromStart ? "nhạc MP3 cả bài" : `nhạc MP3 từ ${start} đến hết`;
    const duration = $("duration").value || "{{ default_duration }}";
    const what = fromStart ? `${duration} giây đầu` : `${duration} giây từ ${start}`;
    return kind === "audio" ? `nhạc ${what}` : what;
  }

  function updateButton() {
    const what = describe();
    if (mode === "one") {
      button.textContent = `Tải ${what}`;
    } else {
      const count = extractLinks($("urls").value).length;
      button.textContent = count ? `Tải ${what} của ${count} video` : `Tải ${what} của từng video`;
      $("urls-count").textContent = count
        ? `Nhận được ${count} link.`
        : "Dán cả đoạn văn cũng được, app sẽ tự lọc ra các link.";
    }
  }
  ["start", "duration", "urls"].forEach((id) => $(id).addEventListener("input", updateButton));

  function setKind(next) {
    kind = next;
    const audio = kind === "audio";
    $("kind-video").setAttribute("aria-checked", !audio);
    $("kind-audio").setAttribute("aria-checked", audio);
    $("quality-field").hidden = audio;  // nhạc không có độ phân giải
    $("time-row").classList.toggle("two", audio);
    $("precise-label").hidden = audio;  // nhạc luôn được cắt chính xác
    $("full-label").hidden = !audio;
    $("duration").disabled = audio && $("full").checked;
    updateButton();
    try { localStorage.setItem("bokin-kind", kind); } catch {}
  }
  $("kind-video").addEventListener("click", () => setKind("video"));
  $("kind-audio").addEventListener("click", () => setKind("audio"));
  $("full").addEventListener("change", () => setKind(kind));

  function setMode(next) {
    mode = next;
    $("tab-one").setAttribute("aria-selected", mode === "one");
    $("tab-many").setAttribute("aria-selected", mode === "many");
    $("one-input").hidden = mode !== "one";
    $("many-input").hidden = mode !== "many";
    $("url").required = mode === "one";
    $("urls").required = mode === "many";
    $("result").hidden = mode !== "one" || !objectUrl;
    $("batch").hidden = mode !== "many" || !items.length;
    statusBox.textContent = "";
    updateButton();
    try { localStorage.setItem("bokin-mode", mode); } catch {}
  }
  $("tab-one").addEventListener("click", () => setMode("one"));
  $("tab-many").addEventListener("click", () => setMode("many"));

  function options() {
    return {
      kind,
      start: $("start").value,
      duration: $("duration").value,
      full: $("full").checked,
      quality: $("quality").value,
      precise: $("precise").checked,
    };
  }

  async function postJson(path, body) {
    const response = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    return response;
  }

  async function errorFrom(response) {
    const data = await response.json().catch(() => ({}));
    return new Error(data.error || `Lỗi máy chủ (${response.status})`);
  }

  function filenameFrom(response) {
    const header = response.headers.get("Content-Disposition") || "";
    const star = header.match(/filename\*=UTF-8''([^;]+)/i);
    if (star) return decodeURIComponent(star[1]);
    const plain = header.match(/filename="?([^";]+)"?/i);
    return plain ? plain[1] : "clip.mp4";
  }

  async function downloadOne() {
    statusBox.textContent = kind === "audio" ? "Đang tải nhạc…" : "Đang tải đoạn video…";
    const began = performance.now();
    const response = await postJson("/api/clip", { url: $("url").value, ...options() });
    if (!response.ok) throw await errorFrom(response);
    const blob = await response.blob();
    const name = filenameFrom(response);
    $("saved-path").textContent = decodeURIComponent(response.headers.get("X-Saved-Path") || name);
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(blob);

    const isAudio = blob.type.startsWith("audio/") || name.toLowerCase().endsWith(".mp3");
    const [show, hide] = isAudio ? [$("preview-audio"), $("preview-video")] : [$("preview-video"), $("preview-audio")];
    hide.pause();
    hide.removeAttribute("src");
    hide.hidden = true;
    show.src = objectUrl;
    show.hidden = false;
    const link = $("download");
    link.href = objectUrl;
    link.download = name;
    $("result").hidden = false;

    const seconds = ((performance.now() - began) / 1000).toFixed(1);
    statusBox.textContent = `Xong sau ${seconds} giây (${(blob.size / 1048576).toFixed(1)} MB).`;
  }

  // ---- Tab "Nhiều video": mỗi link một request /api/save, chạy song song CONCURRENCY link ----

  function setItem(item, state, detail = "") {
    item.state = state;
    item.el.dataset.state = state;
    item.el.querySelector(".badge").textContent = LABELS[state];
    item.el.querySelector(".item-detail").textContent = detail;
  }

  function renderItems(urls) {
    const list = $("items");
    list.replaceChildren();
    items = urls.map((url) => {
      const el = document.createElement("li");
      el.className = "item";
      el.innerHTML = '<span class="badge"></span><div class="item-body"><div class="item-title"></div><div class="item-detail"></div></div>';
      el.querySelector(".item-title").textContent = url;
      list.append(el);
      const item = { url, el };
      setItem(item, "waiting");
      return item;
    });
  }

  function updateSummary(began) {
    const count = (state) => items.filter((item) => item.state === state).length;
    const done = count("done"), failed = count("error"), stopped = count("stopped");
    let text;
    if (running) {
      text = `Đang tải… ${done + failed}/${items.length}`;
    } else {
      const seconds = ((performance.now() - began) / 1000).toFixed(1);
      text = `Xong ${done}/${items.length} video sau ${seconds} giây`;
      if (failed) text += ` · ${failed} lỗi`;
      if (stopped) text += ` · ${stopped} đã dừng`;
    }
    $("batch-summary").textContent = text;
    $("retry").hidden = running || !(failed + stopped);
    $("stop").hidden = !running;
  }

  async function runBatch(queue) {
    const opts = options();  // giữ nguyên tuỳ chọn trong suốt lượt tải
    const began = performance.now();
    running = true;
    stopRequested = false;
    queue.forEach((item) => setItem(item, "waiting"));
    updateSummary(began);

    async function worker() {
      while (queue.length && !stopRequested) {
        const item = queue.shift();
        setItem(item, "working");
        try {
          const response = await postJson("/api/save", { url: item.url, ...opts });
          if (!response.ok) throw await errorFrom(response);
          const data = await response.json();
          item.el.querySelector(".item-title").textContent = data.title || item.url;
          item.el.title = data.path;
          setItem(item, "done", `${data.file} · ${(data.size / 1048576).toFixed(1)} MB`);
        } catch (error) {
          setItem(item, "error", error.message);
        }
        updateSummary(began);
      }
    }
    await Promise.all(Array.from({ length: Math.min(CONCURRENCY, queue.length) }, worker));
    queue.forEach((item) => setItem(item, "stopped"));  // còn lại do bấm Dừng
    running = false;
    updateSummary(began);
  }

  async function downloadMany() {
    const urls = extractLinks($("urls").value);
    if (!urls.length) throw new Error("Không tìm thấy link nào. Mỗi link cần bắt đầu bằng http:// hoặc https://");
    renderItems(urls);
    $("batch").hidden = false;
    await runBatch([...items]);
  }

  $("stop").addEventListener("click", () => {
    stopRequested = true;
    $("stop").disabled = true;
  });

  $("retry").addEventListener("click", async () => {
    $("retry").hidden = true;
    button.disabled = true;
    $("stop").disabled = false;
    await runBatch(items.filter((item) => item.state === "error" || item.state === "stopped"));
    button.disabled = false;
  });

  // ---- Thư mục lưu (dùng chung cho cả hai tab, server nhớ cho các lần sau) ----

  let savedFolder = $("folder").value;

  function folderMessage(text, isError = false) {
    $("folder-status").textContent = text;
    $("folder-status").className = isError ? "hint folder-status error" : "hint folder-status";
  }

  async function useFolderResponse(response) {
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `Lỗi máy chủ (${response.status})`);
    if (data.cancelled) return;
    $("folder").value = savedFolder = data.folder;
    folderMessage("Đã đổi thư mục lưu.");
  }

  // Áp dụng đường dẫn đang gõ trong ô (nếu đã đổi); trả về false nếu đường dẫn không dùng được.
  async function applyFolder() {
    if ($("folder").value.trim() === savedFolder) return true;
    try {
      await useFolderResponse(await postJson("/api/folder", { folder: $("folder").value }));
      return true;
    } catch (error) {
      folderMessage(error.message, true);
      return false;
    }
  }
  $("folder").addEventListener("change", applyFolder);
  $("folder").addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); applyFolder(); }
  });

  $("choose-folder").addEventListener("click", async () => {
    $("choose-folder").disabled = true;
    try {
      if (window.pywebview && window.pywebview.api) {
        // Trong cửa sổ app (desktop.py): dùng hộp thoại chọn thư mục của Windows.
        const picked = await window.pywebview.api.choose_folder($("folder").value);
        if (picked) await useFolderResponse(await postJson("/api/folder", { folder: picked }));
        return;
      }
      folderMessage("Đang mở hộp thoại chọn thư mục (có thể nằm sau cửa sổ trình duyệt)…");
      await useFolderResponse(await postJson("/api/choose-folder", {}));
      if ($("folder-status").textContent.startsWith("Đang mở")) folderMessage("");
    } catch (error) {
      folderMessage(error.message, true);
    } finally {
      $("choose-folder").disabled = false;
    }
  });

  async function openFolder() {
    if (!(await applyFolder())) return;
    const response = await postJson("/api/open-folder", {});
    if (!response.ok) folderMessage((await errorFrom(response)).message, true);
  }
  $("open-folder").addEventListener("click", openFolder);
  document.querySelectorAll(".open-folder").forEach((el) => el.addEventListener("click", openFolder));

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    button.disabled = true;
    $("stop").disabled = false;
    statusBox.className = "status";
    statusBox.textContent = "";
    try {
      if (!(await applyFolder())) throw new Error("Thư mục lưu không dùng được, xem thông báo ở ô \"Lưu vào\".");
      await (mode === "one" ? downloadOne() : downloadMany());
    } catch (error) {
      statusBox.className = "status error";
      statusBox.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });

  // Báo cho app biết trang vẫn đang mở (khi chạy bằng trình duyệt, app tự tắt sau khi trang đóng).
  setInterval(() => fetch("/api/ping").catch(() => {}), 30000);

  let savedMode = "one", savedKind = "video";
  try {
    savedMode = localStorage.getItem("bokin-mode") || "one";
    savedKind = localStorage.getItem("bokin-kind") || "video";
  } catch {}
  setKind(savedKind === "audio" ? "audio" : "video");
  setMode(savedMode === "many" ? "many" : "one");
</script>
</body>
</html>
